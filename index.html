<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Origami Link - Fold Large URLs into Beautiful Links</title>
  <style>
 /* =========================================================
   ORIGAMI LINK
   Complete Responsive CSS
   ========================================================= */

:root {
  --primary: #818cf8;
  --primary-hover: #6366f1;
  --primary-light: rgba(129, 140, 248, 0.10);

  --background: #090d16;
  --background-secondary: #0f172a;

  --card-bg: #111827;
  --card-bg-hover: #162033;

  --input-bg: #1e293b;
  --input-focus-bg: #0f172a;

  --text-main: #f8fafc;
  --text-secondary: #cbd5e1;
  --text-muted: #94a3b8;
  --text-dim: #64748b;

  --border: #263244;
  --border-light: #334155;
  --border-focus: #818cf8;

  --success: #34d399;
  --success-light: rgba(52, 211, 153, 0.08);

  --error: #fb7185;
  --error-light: rgba(251, 113, 133, 0.08);

  --warning: #fbbf24;

  --shadow-sm:
    0 1px 2px rgba(0, 0, 0, 0.35);

  --shadow-md:
    0 8px 20px rgba(0, 0, 0, 0.25);

  --shadow-lg:
    0 20px 45px rgba(0, 0, 0, 0.40);

  --radius-sm: 8px;
  --radius-md: 10px;
  --radius-lg: 16px;

  --transition:
    all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}


/* =========================================================
   RESET
   ========================================================= */

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  width: 100%;
  min-height: 100%;
  scroll-behavior: smooth;
}

body {
  width: 100%;
  min-height: 100vh;

  background:
    radial-gradient(
      circle at 0% 0%,
      rgba(99, 102, 241, 0.14),
      transparent 42%
    ),
    radial-gradient(
      circle at 100% 100%,
      rgba(99, 102, 241, 0.08),
      transparent 42%
    ),
    var(--background);

  color: var(--text-main);

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    "Helvetica Neue",
    Arial,
    sans-serif;

  line-height: 1.5;

  display: flex;
  flex-direction: column;
  align-items: center;

  padding: 40px 20px;

  overflow-x: hidden;

  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}


/* =========================================================
   SCROLLBAR
   ========================================================= */

::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: #334155;
  border-radius: 999px;
}

::-webkit-scrollbar-thumb:hover {
  background: #475569;
}


/* =========================================================
   SELECTION
   ========================================================= */

::selection {
  background: rgba(129, 140, 248, 0.30);
  color: #ffffff;
}


/* =========================================================
   APP LAYOUT
   ========================================================= */

.app-wrapper {
  width: 100%;
  max-width: 600px;

  display: flex;
  flex-direction: column;

  gap: 20px;

  margin: 0 auto;
}


/* =========================================================
   MAIN CARD
   ========================================================= */

.container {
  width: 100%;

  background: var(--card-bg);

  border: 1px solid var(--border);
  border-radius: var(--radius-lg);

  box-shadow: var(--shadow-lg);

  padding: 40px;

  position: relative;

  overflow: hidden;

  transition: var(--transition);
}

.container::before {
  content: "";

  position: absolute;

  top: 0;
  left: 0;
  right: 0;

  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(129, 140, 248, 0.5),
      transparent
    );

  pointer-events: none;
}


/* =========================================================
   NAVBAR
   ========================================================= */

.nav {
  width: 100%;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 12px;

  padding: 12px 18px;

  background: rgba(17, 24, 39, 0.92);

  border: 1px solid var(--border);

  border-radius: 12px;

  box-shadow: var(--shadow-sm);

  font-size: 13px;

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  animation: fadeIn 0.25s ease;
}

.user-info {
  min-width: 0;

  display: flex;
  align-items: center;

  gap: 8px;

  color: var(--text-muted);

  font-weight: 500;
}

.user-info svg {
  flex-shrink: 0;
  color: var(--primary);
}

#user-email {
  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;
}

.logout-btn {
  flex-shrink: 0;

  color: var(--error);

  cursor: pointer;

  font-weight: 600;

  text-decoration: none;

  transition: var(--transition);

  user-select: none;
}

.logout-btn:hover {
  color: #fda4af;
}

.logout-btn:active {
  transform: scale(0.97);
}


/* =========================================================
   HEADER
   ========================================================= */

.header {
  width: 100%;

  text-align: center;

  margin-bottom: 32px;
}

.logo-container {
  display: flex;
  align-items: center;
  justify-content: center;

  gap: 12px;

  margin-bottom: 10px;
}

.logo-icon {
  width: 36px;
  height: 36px;

  flex-shrink: 0;

  color: var(--primary);

  filter:
    drop-shadow(
      0 0 10px rgba(129, 140, 248, 0.35)
    );
}

.header h1 {
  color: var(--text-main);

  font-size: 32px;
  line-height: 1.15;

  font-weight: 800;

  letter-spacing: -0.035em;
}

.header p {
  margin-top: 7px;

  color: var(--text-muted);

  font-size: 15px;

  line-height: 1.5;
}


/* =========================================================
   FORM
   ========================================================= */

.form-group {
  width: 100%;

  margin-bottom: 22px;
}

.form-group:last-child {
  margin-bottom: 0;
}

label {
  display: block;

  margin-bottom: 8px;

  color: var(--text-muted);

  font-size: 12px;

  font-weight: 700;

  text-transform: uppercase;

  letter-spacing: 0.055em;
}


/* =========================================================
   INPUT WRAPPER
   ========================================================= */

.input-wrapper {
  width: 100%;

  position: relative;

  display: flex;
  align-items: center;
}

.input-icon {
  position: absolute;

  left: 14px;

  z-index: 2;

  display: flex;
  align-items: center;
  justify-content: center;

  color: var(--text-muted);

  pointer-events: none;

  transition: color 0.2s ease;
}

.input-wrapper:focus-within .input-icon {
  color: var(--primary);
}


/* =========================================================
   INPUTS
   ========================================================= */

input {
  width: 100%;
  min-width: 0;

  height: 48px;

  padding: 0 16px 0 44px;

  border: 1.5px solid var(--border);

  border-radius: var(--radius-md);

  outline: none;

  background: var(--input-bg);

  color: var(--text-main);

  font-family: inherit;
  font-size: 15px;

  line-height: 1;

  transition: var(--transition);

  -webkit-appearance: none;
  appearance: none;
}

input::placeholder {
  color: #64748b;
  opacity: 1;
}

input:hover {
  border-color: var(--border-light);
}

input:focus {
  border-color: var(--border-focus);

  background: var(--input-focus-bg);

  box-shadow:
    0 0 0 4px rgba(129, 140, 248, 0.12);
}

input:disabled {
  opacity: 0.55;

  cursor: not-allowed;
}


/* Remove browser autofill colors */

input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus {
  -webkit-text-fill-color: var(--text-main);

  box-shadow:
    0 0 0 1000px var(--input-bg) inset;

  transition:
    background-color 9999s ease-in-out 0s;
}


/* =========================================================
   ALIAS INPUT
   ========================================================= */

.alias-group {
  width: 100%;
  min-width: 0;

  display: flex;
  align-items: stretch;

  overflow: hidden;

  background: var(--input-bg);

  border: 1.5px solid var(--border);

  border-radius: var(--radius-md);

  transition: var(--transition);
}

.alias-group:hover {
  border-color: var(--border-light);
}

.alias-group:focus-within {
  border-color: var(--border-focus);

  background: var(--input-focus-bg);

  box-shadow:
    0 0 0 4px rgba(129, 140, 248, 0.12);
}

.domain-badge {
  flex: 0 0 auto;

  display: flex;
  align-items: center;

  min-height: 48px;

  padding: 0 15px;

  background: #0f172a;

  border-right: 1px solid var(--border);

  color: var(--text-muted);

  font-size: 14px;

  font-weight: 600;

  white-space: nowrap;

  user-select: none;
}

.alias-group input {
  flex: 1 1 auto;

  width: 100%;
  min-width: 0;

  height: 48px;

  padding: 0 14px;

  background: transparent;

  border: none;

  border-radius: 0;

  box-shadow: none;
}

.alias-group input:hover,
.alias-group input:focus {
  border: none;

  box-shadow: none;

  background: transparent;
}


/* =========================================================
   STATUS / AVAILABILITY
   ========================================================= */

.status-badge {
  display: inline-flex;
  align-items: center;

  gap: 6px;

  margin-top: 8px;

  min-height: 18px;

  font-size: 12px;

  font-weight: 600;
}

.status-badge svg {
  flex-shrink: 0;
}

.status-available {
  color: var(--success);
}

.status-unavailable {
  color: var(--error);
}

.status-checking {
  color: var(--primary);
}


/* =========================================================
   BUTTON BASE
   ========================================================= */

.btn {
  width: 100%;
  min-height: 48px;

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 10px;

  padding: 13px 16px;

  border: 1px solid transparent;

  border-radius: var(--radius-md);

  outline: none;

  font-family: inherit;

  font-size: 15px;

  font-weight: 700;

  line-height: 1;

  cursor: pointer;

  transition:
    transform 0.18s ease,
    background 0.18s ease,
    border-color 0.18s ease,
    box-shadow 0.18s ease,
    opacity 0.18s ease;

  user-select: none;

  -webkit-tap-highlight-color: transparent;
}

.btn svg {
  flex-shrink: 0;
}

.btn:active:not(:disabled) {
  transform: scale(0.985);
}

.btn:focus-visible {
  box-shadow:
    0 0 0 4px rgba(129, 140, 248, 0.18);
}


/* =========================================================
   PRIMARY BUTTON
   ========================================================= */

.btn-primary {
  background: var(--primary);

  color: #080b14;

  border-color: transparent;

  box-shadow:
    0 6px 14px rgba(99, 102, 241, 0.22);
}

.btn-primary:hover:not(:disabled) {
  background: var(--primary-hover);

  transform: translateY(-1px);

  box-shadow:
    0 8px 18px rgba(99, 102, 241, 0.28);
}

.btn-primary:disabled {
  background: #1f2937;

  color: #64748b;

  border-color: #263244;

  cursor: not-allowed;

  box-shadow: none;

  opacity: 0.8;
}


/* =========================================================
   SECONDARY BUTTON
   ========================================================= */

.btn-secondary {
  background: transparent;

  color: var(--text-main);

  border: 1.5px solid var(--border);
}

.btn-secondary:hover {
  background: var(--input-bg);

  border-color: var(--border-light);

  transform: translateY(-1px);
}


/* =========================================================
   GOOGLE BUTTON
   ========================================================= */

.google-btn {
  background: var(--input-bg);

  color: var(--text-main);

  border: 1.5px solid var(--border);

  box-shadow: var(--shadow-sm);
}

.google-btn:hover {
  background: #273449;

  border-color: var(--border-light);

  transform: translateY(-1px);

  box-shadow: var(--shadow-md);
}

.google-btn svg {
  flex-shrink: 0;
}


/* =========================================================
   DIVIDER
   ========================================================= */

.divider {
  width: 100%;

  display: flex;
  align-items: center;

  margin: 24px 0;

  color: var(--text-muted);

  font-size: 11px;

  font-weight: 700;

  text-transform: uppercase;

  letter-spacing: 0.08em;

  white-space: nowrap;
}

.divider::before,
.divider::after {
  content: "";

  flex: 1;

  height: 1px;

  background: var(--border);
}

.divider:not(:empty)::before {
  margin-right: 14px;
}

.divider:not(:empty)::after {
  margin-left: 14px;
}


/* =========================================================
   AUTH LINKS
   ========================================================= */

.toggle-link {
  display: block;

  margin-top: 16px;

  color: var(--primary);

  font-size: 13px;

  font-weight: 600;

  line-height: 1.4;

  text-align: center;

  text-decoration: none;

  cursor: pointer;

  transition: color 0.2s ease;

  -webkit-tap-highlight-color: transparent;
}

.toggle-link:hover {
  color: #a5b4fc;

  text-decoration: underline;
}


/* =========================================================
   RESULT BOX
   ========================================================= */

.result-box {
  width: 100%;

  margin-top: 28px;

  padding: 22px;

  display: flex;
  flex-direction: column;
  align-items: center;

  gap: 14px;

  background: var(--success-light);

  border: 1.5px dashed rgba(52, 211, 153, 0.75);

  border-radius: 12px;

  text-align: center;

  animation: fadeIn 0.3s ease;
}

.result-box .status-badge {
  margin-top: 0;
}

.result-link {
  display: block;

  max-width: 100%;

  color: var(--success);

  font-size: 18px;

  font-weight: 750;

  line-height: 1.4;

  text-decoration: none;

  word-break: break-all;

  overflow-wrap: anywhere;

  border-bottom: 2px solid transparent;

  transition: border-color 0.2s ease;
}

.result-link:hover {
  border-color: var(--success);
}


/* =========================================================
   HISTORY CARD
   ========================================================= */

.history-card {
  width: 100%;

  margin-top: 0;

  padding: 28px;

  background: var(--card-bg);

  border: 1px solid var(--border);

  border-radius: var(--radius-lg);

  box-shadow: var(--shadow-md);

  position: relative;

  overflow: hidden;

  animation: fadeIn 0.3s ease;
}

.history-card::before {
  content: "";

  position: absolute;

  top: 0;
  left: 0;
  right: 0;

  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(129, 140, 248, 0.35),
      transparent
    );

  pointer-events: none;
}


/* =========================================================
   HISTORY TITLE
   ========================================================= */

.history-title {
  width: 100%;

  display: flex;
  align-items: center;

  gap: 8px;

  margin-bottom: 16px;

  color: var(--text-main);

  font-size: 16px;

  font-weight: 750;

  line-height: 1.3;
}

.history-title svg {
  flex-shrink: 0;

  color: var(--primary);
}


/* =========================================================
   HISTORY LIST
   IMPORTANT FIX FOR THE LARGE EMPTY AREA
   ========================================================= */

.history-list {
  width: 100%;

  display: flex;
  flex-direction: column;

  gap: 12px;

  /*
   * Do NOT give this element a fixed height.
   * It should grow only when actual links exist.
   */
  height: auto;

  min-height: 0;

  max-height: 500px;

  overflow-y: auto;
  overflow-x: hidden;

  padding-right: 2px;

  scrollbar-gutter: stable;
}


/* Empty history must remain small */

.history-list:empty {
  display: none;
}


/* =========================================================
   HISTORY ITEM
   ========================================================= */

.history-item {
  width: 100%;

  min-width: 0;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 12px;

  padding: 14px;

  background: var(--input-bg);

  border: 1px solid var(--border);

  border-radius: var(--radius-md);

  flex: 0 0 auto;

  transition:
    background 0.2s ease,
    border-color 0.2s ease,
    transform 0.2s ease;
}

.history-item:hover {
  background: var(--card-bg-hover);

  border-color: var(--border-light);

  transform: translateY(-1px);
}


/* =========================================================
   HISTORY URL DETAILS
   ========================================================= */

.history-url-details {
  min-width: 0;

  flex: 1 1 auto;

  display: flex;
  flex-direction: column;

  gap: 4px;
}

.history-short {
  display: block;

  max-width: 100%;

  color: var(--primary);

  font-size: 14px;

  font-weight: 700;

  line-height: 1.35;

  text-decoration: none;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;

  overflow-wrap: anywhere;
}

.history-short:hover {
  color: #a5b4fc;
}

.history-long {
  display: block;

  max-width: 100%;

  color: var(--text-muted);

  font-size: 12px;

  line-height: 1.4;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;
}


/* =========================================================
   CLICK INFORMATION
   ========================================================= */

.click-info {
  width: 100%;

  display: flex;
  align-items: center;

  gap: 8px;

  margin-top: 8px;

  flex-wrap: wrap;
}

.click-badge {
  display: inline-flex;
  align-items: center;

  gap: 6px;

  padding: 5px 9px;

  background: var(--primary-light);

  border: 1px solid rgba(129, 140, 248, 0.20);

  border-radius: 999px;

  color: var(--primary);

  font-size: 11px;

  font-weight: 700;

  line-height: 1;
}

.click-badge svg {
  flex-shrink: 0;
}


/* =========================================================
   SMALL COPY BUTTON
   ========================================================= */

.copy-sm {
  flex: 0 0 auto;

  min-height: 32px;

  padding: 6px 10px;

  background: #0f172a;

  color: var(--text-main);

  border: 1px solid var(--border);

  border-radius: 7px;

  font-family: inherit;

  font-size: 11px;

  font-weight: 700;

  line-height: 1;

  cursor: pointer;

  transition: var(--transition);

  white-space: nowrap;
}

.copy-sm:hover {
  background: #1e293b;

  border-color: var(--border-light);

  transform: translateY(-1px);
}

.copy-sm:active {
  transform: scale(0.96);
}


/* =========================================================
   RESET CLICKS BUTTON
   ========================================================= */

.reset-clicks-btn {
  min-height: 32px;

  padding: 6px 10px;

  background: transparent;

  color: var(--error);

  border: 1px solid rgba(251, 113, 133, 0.35);

  border-radius: 7px;

  font-family: inherit;

  font-size: 11px;

  font-weight: 700;

  line-height: 1;

  cursor: pointer;

  transition: var(--transition);
}

.reset-clicks-btn:hover {
  background: var(--error-light);

  border-color: var(--error);

  transform: translateY(-1px);
}

.reset-clicks-btn:active {
  transform: scale(0.96);
}


/* =========================================================
   DELETE NOTE
   ========================================================= */

.delete-note {
  display: block;

  color: var(--text-muted);

  font-size: 11px;

  line-height: 1.4;
}


/* =========================================================
   HISTORY STATES
   ========================================================= */

.loading-history {
  width: 100%;

  padding: 18px 10px;

  color: var(--text-muted);

  font-size: 13px;

  text-align: center;
}

.empty-history {
  width: 100%;

  padding: 22px 10px;

  color: var(--text-muted);

  font-size: 13px;

  line-height: 1.5;

  text-align: center;
}


/* =========================================================
   HIDDEN
   ========================================================= */

.hidden {
  display: none !important;
}


/* =========================================================
   LINKS
   ========================================================= */

a {
  -webkit-tap-highlight-color: transparent;
}


/* =========================================================
   FOCUS ACCESSIBILITY
   ========================================================= */

button:focus-visible,
a:focus-visible,
input:focus-visible {
  outline: 2px solid var(--primary);

  outline-offset: 2px;
}


/* =========================================================
   ANIMATIONS
   ========================================================= */

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(15px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}


/* =========================================================
   TABLET
   ========================================================= */

@media (max-width: 700px) {

  body {
    padding: 28px 16px;
  }

  .app-wrapper {
    max-width: 600px;

    gap: 16px;
  }

  .container {
    padding: 32px;
  }
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

  body {
    padding: 18px 12px;

    min-height: 100dvh;
  }

  .app-wrapper {
    width: 100%;

    gap: 14px;
  }

  .container {
    width: 100%;

    padding: 24px 18px;

    border-radius: 14px;
  }

  .nav {
    padding: 11px 14px;

    border-radius: 10px;

    font-size: 12px;
  }

  .header {
    margin-bottom: 26px;
  }

  .logo-container {
    gap: 9px;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
  }

  .header h1 {
    font-size: 26px;
  }

  .header p {
    font-size: 14px;
  }

  input {
    height: 47px;

    font-size: 15px;
  }

  .domain-badge {
    min-height: 47px;

    padding: 0 10px;

    font-size: 12px;
  }

  .alias-group input {
    height: 47px;

    padding-left: 12px;
    padding-right: 12px;
  }

  .btn {
    min-height: 48px;

    font-size: 14px;
  }

  .result-box {
    padding: 18px;

    margin-top: 24px;
  }

  .result-link {
    font-size: 16px;
  }

  .history-card {
    padding: 20px 16px;

    border-radius: 14px;
  }

  .history-list {
    max-height: 450px;
  }

  .history-item {
    flex-direction: column;

    align-items: stretch;

    gap: 10px;

    padding: 13px;
  }

  .history-short {
    font-size: 13px;
  }

  .history-long {
    font-size: 11px;
  }

  .copy-sm {

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      sendPasswordResetEmail,
      signInWithPopup,
      GoogleAuthProvider,
      onAuthStateChanged,
      signOut,
      sendEmailVerification // Added for Email Verification
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    
    import {
  getDatabase
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    let auth;
    let db;
    let authMode = 'login';
    let isAliasAvailable = true;
    let debounceTimer;

    const authSection = document.getElementById('auth-section');
    const appSection = document.getElementById('app-section');
    const authForm = document.getElementById('auth-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const passwordGroup = document.getElementById('password-group');
    const submitAuthBtn = document.getElementById('submit-auth-btn');
    const googleLoginBtn = document.getElementById('google-login');
    const toggleAuthModeLink = document.getElementById('toggle-auth-mode');
    const forgotPasswordLink = document.getElementById('forgot-password-link');
    const authSubtitle = document.getElementById('auth-subtitle');
    const nav = document.getElementById('nav');
    const userEmailSpan = document.getElementById('user-email');
    const logoutBtn = document.getElementById('logout-btn');

    const shortenForm = document.getElementById('shorten-form');
    const longUrlInput = document.getElementById('long-url');
    const customAliasInput = document.getElementById('custom-alias');
    const availabilityText = document.getElementById('availability-text');
    const shortenBtn = document.getElementById('shorten-btn');
    const resultBox = document.getElementById('result-box');
    const shortLinkAnchor = document.getElementById('short-link');
    const copyBtn = document.getElementById('copy-btn');
    const domainPlaceholder = document.getElementById('domain-placeholder');

    const historySection = document.getElementById('history-section');
    const historyList = document.getElementById('history-list');

    domainPlaceholder.textContent = window.location.host + '/';

    async function initFirebase() {
      try {
        const response = await fetch('/api/config');
        const config = await response.json();
        const app = initializeApp(config);
        auth = getAuth(app);
        db = getDatabase(app);

        onAuthStateChanged(auth, async (user) => {
  
  if (user) {
    
    if (
      user.emailVerified ||
      user.providerData.some(
        p => p.providerId === "google.com"
      )
    ) {
      
      userEmailSpan.textContent =
        user.email;
      
      nav.classList.remove("hidden");
      
      authSection.classList.add("hidden");
      
      appSection.classList.remove("hidden");
      
      generateRandomAlias();
      
      await loadMyLinks();
      
    } else {
      
      alert(
        "Please verify your email address before logging in. " +
        "A confirmation link has been sent to " +
        user.email
      );
      
      await signOut(auth);
    }
    
  } else {
    
    nav.classList.add("hidden");
    
    authSection.classList.remove("hidden");
    
    appSection.classList.add("hidden");
    
    historySection.classList.add("hidden");
  }
});
      } catch (err) {
        console.error(err);
        alert('Failed to initialize configuration: ' + err.message);
      }
    }

    initFirebase();

    // UI Auth State Toggle
    toggleAuthModeLink.addEventListener('click', () => {
      if (authMode === 'login' || authMode === 'forgot') {
        authMode = 'signup';
        authSubtitle.textContent = 'Create your free workspace account';
        passwordGroup.classList.remove('hidden');
        passwordInput.required = true;
        submitAuthBtn.textContent = 'Sign Up';
        toggleAuthModeLink.textContent = 'Have an account? Log In';
        forgotPasswordLink.classList.add('hidden');
      } else {
        setLoginMode();
      }
    });

    forgotPasswordLink.addEventListener('click', () => {
      authMode = 'forgot';
      authSubtitle.textContent = 'Enter your email to recover your credentials';
      passwordGroup.classList.add('hidden');
      passwordInput.required = false;
      submitAuthBtn.textContent = 'Send Reset Email';
      toggleAuthModeLink.textContent = 'Back to Log In';
      forgotPasswordLink.classList.add('hidden');
    });

    function setLoginMode() {
      authMode = 'login';
      authSubtitle.textContent = 'Sign in to start folding your links';
      passwordGroup.classList.remove('hidden');
      passwordInput.required = true;
      submitAuthBtn.textContent = 'Sign In';
      toggleAuthModeLink.textContent = 'Need an account? Sign Up';
      forgotPasswordLink.classList.remove('hidden');
    }

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      try {
        if (authMode === 'login') {
          await signInWithEmailAndPassword(auth, email, password);
        } else if (authMode === 'signup') {
          // 1. Create the user
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          // 2. Send the confirmation email
          await sendEmailVerification(userCredential.user);
          alert('Registration successful! A confirmation email has been sent to ' + email + '. Please verify your account before logging in.');
          // 3. Immediately sign out to prevent premature dashboard entry
          await signOut(auth);
          setLoginMode();
        } else if (authMode === 'forgot') {
          await sendPasswordResetEmail(auth, email);
          alert('Password reset instructions sent to your email.');
          setLoginMode();
        }
      } catch (err) {
        alert(err.message);
      }
    });

    googleLoginBtn.addEventListener('click', async () => {
      const provider = new GoogleAuthProvider();
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        alert(err.message);
      }
    });

    logoutBtn.addEventListener('click', () => {
      signOut(auth);
    });

    // Random Generation
    function generateRandomAlias() {
      const randId = Math.random().toString(36).substring(2, 8);
      customAliasInput.value = randId;
      checkAliasAvailability(randId);
    }

    // Input Debouncing
    customAliasInput.addEventListener('input', () => {
      const value = customAliasInput.value.trim();
      resultBox.classList.add('hidden');
      
      if (!value) {
        setAvailabilityState(false, 'Alias is required.', 'status-unavailable');
        return;
      }

      const regex = /^[a-zA-Z0-9_-]+$/;
      if (!regex.test(value)) {
        setAvailabilityState(false, 'Letters, numbers, - and _ only.', 'status-unavailable');
        return;
      }

      setAvailabilityState(false, 'Checking availability...', 'status-checking');

      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        checkAliasAvailability(value);
      }, 500);
    });

    async function checkAliasAvailability(alias) {
      try {
        const res = await fetch(`/api/check-alias?id=${encodeURIComponent(alias)}`);
        const data = await res.json();
        if (data.available) {
          setAvailabilityState(true, '✔ Alias is available!', 'status-available');
        } else {
          setAvailabilityState(false, '❌ Taken or invalid format.', 'status-unavailable');
        }
      } catch (e) {
        setAvailabilityState(false, 'Error checking availability.', 'status-unavailable');
      }
    }

    function setAvailabilityState(available, text, className) {
      isAliasAvailable = available;
      availabilityText.textContent = text;
      availabilityText.className = `status-badge ${className}`;
      shortenBtn.disabled = !available;
    }

    // Authenticated Direct DB Write
   shortenForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  
  if (!isAliasAvailable) {
    return;
  }
  
  const longUrl = longUrlInput.value.trim();
  const shortId = customAliasInput.value.trim();
  
  const user = auth.currentUser;
  
  if (!user) {
    alert("You must be logged in.");
    return;
  }
  
  try {
    shortenBtn.disabled = true;
    shortenBtn.textContent = "Folding...";
    
    const idToken = await user.getIdToken();
    
    const response = await fetch("/api/shorten", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${idToken}`
      },
      body: JSON.stringify({
        longUrl,
        shortId
      })
    });
    
    const data = await response.json();
    
    if (!response.ok) {
      throw new Error(
        data.error || "Failed to create link."
      );
    }
    
    const generatedLink =
      `${window.location.origin}/${shortId}`;
    
    shortLinkAnchor.href = generatedLink;
    shortLinkAnchor.textContent = generatedLink;
    
    resultBox.classList.remove("hidden");
    
    longUrlInput.value = "";
    
    await loadMyLinks();
    
  } catch (error) {
    console.error(error);
    
    alert(error.message);
    
  } finally {
    shortenBtn.disabled = false;
    shortenBtn.textContent = "Fold Link";
    
    if (customAliasInput.value.trim()) {
      checkAliasAvailability(
        customAliasInput.value.trim()
      );
    }
  }
});

    // LocalStorage Link Tracker History Logic
    

    async function loadMyLinks() {
  const user = auth.currentUser;

  if (!user) {
    historySection.classList.add("hidden");
    return;
  }

  historySection.classList.remove("hidden");

  historyList.innerHTML = `
    <div class="loading-history">
      Loading your links...
    </div>
  `;

  try {
    const idToken = await user.getIdToken();

    const response = await fetch("/api/my-links", {
      method: "GET",
      headers: {
        "Authorization": `Bearer ${idToken}`
      }
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Failed to load links."
      );
    }

    renderLinks(data.links || []);

  } catch (error) {
    console.error(error);

    historyList.innerHTML = `
      <div class="empty-history">
        Failed to load your links.
      </div>
    `;
  }
}
function renderLinks(links) {
  if (!links || links.length === 0) {
    historySection.classList.remove("hidden");

    historyList.innerHTML = `
      <div class="empty-history">
        You haven't created any links yet.
      </div>
    `;

    return;
  }

  historySection.classList.remove("hidden");

  historyList.innerHTML = "";

  links.forEach((item) => {
    const fullShortUrl =
      `${window.location.origin}/${item.shortId}`;

    const itemDiv =
      document.createElement("div");

    itemDiv.className = "history-item";

    itemDiv.innerHTML = `
      <div class="history-url-details">

        <a
          href="${escapeHtml(fullShortUrl)}"
          target="_blank"
          rel="noopener noreferrer"
          class="history-short"
        >
          ${escapeHtml(window.location.host)}/${escapeHtml(item.shortId)}
        </a>

        <span class="history-long">
          ${escapeHtml(item.longUrl)}
        </span>

        <div class="click-info">

          <span class="click-badge">
            <svg
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 12s3-7 9-7 9 7 9 7-3 7-9 7-9-7-9-7z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>

            ${Number(item.clicks) || 0}
            ${(Number(item.clicks) || 0) === 1 ? "Click" : "Clicks"}
          </span>

          <button
            class="reset-clicks-btn"
            data-reset-id="${escapeHtml(item.shortId)}"
          >
            Reset Clicks
          </button>

        </div>

      </div>

      <button
        class="copy-sm"
        data-copy="${escapeHtml(fullShortUrl)}"
      >
        Copy
      </button>
    `;

    historyList.appendChild(itemDiv);
  });

  attachLinkActions();
}
function attachLinkActions() {
  const copyButtons =
    historyList.querySelectorAll("[data-copy]");

  copyButtons.forEach((button) => {
    button.addEventListener("click", async () => {
      const url = button.dataset.copy;

      try {
        await navigator.clipboard.writeText(url);

        const oldText = button.textContent;

        button.textContent = "Copied!";

        setTimeout(() => {
          button.textContent = oldText;
        }, 1500);

      } catch (error) {
        console.error(error);
        alert("Failed to copy link.");
      }
    });
  });

  const resetButtons =
    historyList.querySelectorAll("[data-reset-id]");

  resetButtons.forEach((button) => {
    button.addEventListener("click", async () => {
      const shortId =
        button.dataset.resetId;

      const confirmed = confirm(
        "Reset the click count for this link to 0?"
      );

      if (!confirmed) {
        return;
      }

      await resetClicks(shortId, button);
    });
  });
}
async function resetClicks(shortId, button) {
  const user = auth.currentUser;

  if (!user) {
    alert("You must be logged in.");
    return;
  }

  try {
    button.disabled = true;
    button.textContent = "Resetting...";

    const idToken = await user.getIdToken();

    const response = await fetch("/api/reset-clicks", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${idToken}`
      },
      body: JSON.stringify({
        shortId
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Failed to reset clicks."
      );
    }

    await loadMyLinks();

  } catch (error) {
    console.error(error);

    alert(error.message);

    button.disabled = false;
    button.textContent = "Reset Clicks";
  }
}
function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

    // Top-level Global Copy Link Event
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(shortLinkAnchor.textContent);
